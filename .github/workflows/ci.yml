name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --input-type=module --check < desktop/plugin.js
      - run: node tests/desktop-smoke.mjs
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 3b421578588243f920886e6fe79a6faa87ea026e
          path: hermes
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Prepare official locked Hermes runtime
        working-directory: hermes
        run: uv sync --frozen --no-dev --python 3.14
        env:
          UV_EXCLUDE_NEWER: "3 days"
      - name: Validate plugin
        working-directory: hermes
        run: uv run --no-sync hermes plugins validate "$GITHUB_WORKSPACE/plugin" --install-deps
        env:
          SPAWN_CLIENT_ID: hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-validation
      - name: Doctor
        working-directory: hermes
        run: uv run --no-sync hermes plugins doctor "$GITHUB_WORKSPACE/plugin" --ci
        env:
          SPAWN_CLIENT_ID: hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-validation
